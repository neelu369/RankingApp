version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: ranking_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=ranking_app
    networks:
      - ranking_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ranking_backend
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=ranking_app
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./config:/app/config
    networks:
      - ranking_network
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ranking_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    networks:
      - ranking_network
    environment:
      - REACT_APP_API_URL=http://localhost:8000

networks:
  ranking_network:
    driver: bridge

volumes:
  mongodb_data:
